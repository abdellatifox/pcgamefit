name = "pcgamefit"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --------------------------------------------------------------------------
# The ids below are placeholders. Deployment will fail until each is replaced
# with a real resource id. Create them with:
#
#   npx wrangler d1 create pcgamefit-db
#   npx wrangler kv namespace create PGF_KV
#   npx wrangler kv namespace create SESSION
#   npx wrangler r2 bucket create pcgamefit-assets
#
# then paste the ids each command prints into the matching field.
#
# The site degrades gracefully without them: src/lib/db.ts falls back to the
# rows baked out of migrations/, so pages still render. D1 is what makes the
# content editable without a redeploy.
# --------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "pcgamefit-db"
database_id = "f9cf287b-051c-440c-93ee-4b468a0cf503"
migrations_dir = "migrations"

# Caches autocomplete results. Optional: the search APIs skip the cache and
# query directly when this namespace is missing or erroring.
[[kv_namespaces]]
binding = "PGF_KV"
id = "cabbc2ee9b044d52ab4a5acc184bc3d0"

# Required by @astrojs/cloudflare's session support. Without it the build
# warns "Invalid binding `SESSION`".
[[kv_namespaces]]
binding = "SESSION"
id = "a9f50da3521746b79875f04e18d7bb08"

# R2 is not yet enabled on this Cloudflare account (dashboard -> R2 -> Enable).
# Nothing in src/ reads PGF_R2 yet, so the site does not need this binding to
# run. Once R2 is enabled: npx wrangler r2 bucket create pcgamefit-assets,
# then uncomment this block.
# [[r2_buckets]]
# binding = "PGF_R2"
# bucket_name = "pcgamefit-assets"
