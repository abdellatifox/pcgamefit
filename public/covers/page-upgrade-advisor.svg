<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="What should I upgrade first?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1320"/>
      <stop offset="1" stop-color="#070810"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BC8FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5BC8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5BC8FF"/>
      <stop offset="1" stop-color="#1f5f85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="925" cy="155" r="330" fill="url(#glow)"/>

  <!-- Angled rule set, echoing the site's accent lines -->
  <g transform="rotate(-3 990 510)" opacity="0.5">
    <rect x="870" y="290" width="8" height="460" rx="4" fill="#5BC8FF" opacity="0.1"/>
    <rect x="904" y="290" width="8" height="460" rx="4" fill="#5BC8FF" opacity="0.155"/>
    <rect x="938" y="290" width="8" height="460" rx="4" fill="#5BC8FF" opacity="0.21000000000000002"/>
    <rect x="972" y="290" width="8" height="460" rx="4" fill="#5BC8FF" opacity="0.265"/>
    <rect x="1006" y="290" width="8" height="460" rx="4" fill="#5BC8FF" opacity="0.32"/>
  </g>

  <rect x="0" y="0" width="1200" height="6" fill="url(#bar)"/>

  <g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="26" font-weight="700" letter-spacing="4" fill="#5BC8FF">
      TOOL
    </text>
    <text font-size="70" font-weight="800" fill="#F2F5F9" letter-spacing="-1"><tspan x="80" y="292">What should I upgrade</tspan><tspan x="80" y="374">first?</tspan></text>
    <text x="80" y="568" font-size="27" font-weight="600" fill="#7E8796">
      PCGameFit<tspan fill="#5BC8FF">.com</tspan>
    </text>
  </g>
